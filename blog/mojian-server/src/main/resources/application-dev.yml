server:
  port: 8800
spring:
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  datasource: # 182.92.85.80  03171122991j!
    url: jdbc:mysql://182.92.85.80:3306/shiyi_blog?characterEncoding=UTF-8&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&tinyInt1isBit=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 03171122991j!
    hikari:
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接池大小
      maximum-pool-size: 20
      # 连接超时时间(毫秒)
      connection-timeout: 30000
      # 空闲连接超时时间(毫秒),默认600000(10分钟)
      idle-timeout: 600000
      # 连接最大生命周期(毫秒),建议设置为30分钟,必须小于MySQL的wait_timeout
      max-lifetime: 1800000
      # 每 5 分钟对空闲连接发送一次心跳，防止被 MySQL 或代理层判定为失效
      keepalive-time: 300000
      # 连接测试查询
      connection-test-query: SELECT 1
      # 是否自动提交
      auto-commit: true
      # 连接池名称
      pool-name: HikariPool-1
  redis:
    host: 182.92.85.80
    password: 03171122991j!
    port: 6379
    timeout: 5000
    database: 8
    lettuce:
      # 开启连接验证，每次取连接前先 PING
      ping-before-activate-connection: true
      pool:
        # 关键：必须关闭共享连接，否则连接池参数全部无效
        share-native-connection: false
        max-active: 16
        max-idle: 8
        min-idle: 4
        # 必须为正值，否则空闲连接驱逐线程不会启动
        time-between-eviction-runs: 30s
        max-wait: 2000ms

